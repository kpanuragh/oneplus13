name: ci

on:
  push:
  pull_request:

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes shellcheck-py
      - run: python -m pyflakes tools tests
      - run: python -m unittest discover -s tests -v
      - run: shellcheck -S warning scripts/*.sh initramfs/init

  dts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y device-tree-compiler cpp
      - run: scripts/check-dts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sm8750-oneplus-dodge.dtb
          path: out/dtb-check/sm8750-oneplus-dodge.dtb
